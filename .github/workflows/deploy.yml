# Anthro Collect deploy — on merge to main: the same checks as CI, then wait for Ryan's
# approval (the `production` environment's required reviewer), then `wrangler deploy`.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production # requires Ryan's approval
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check
        if: steps.deploy.outputs.url != ''
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSf "${{ steps.deploy.outputs.url }}/api/health" | grep -q '"ok":true'; then
              echo "Live: ${{ steps.deploy.outputs.url }}"; exit 0
            fi
            sleep 5
          done
          echo "::error::/api/health did not return ok"; exit 1
