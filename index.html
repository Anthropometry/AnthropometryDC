<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Anthro Collect — a student research project at Ashesi University." />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Anthro Collect" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Anthro Collect</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- DIAGNOSTIC BRANCH ONLY (PR #8, never merged): on ?pad-test, show any error on screen. -->
    <script>
      if (location.search.indexOf('pad-test') !== -1) {
        (function () {
          var box = document.createElement('pre')
          box.id = 'diag-errors'
          box.style.cssText = 'white-space:pre-wrap;font:12px monospace;background:#fee2e2;color:#7f1d1d;padding:8px;margin:8px;display:none'
          document.body.appendChild(box)
          window.__diag = function (m) { box.style.display = 'block'; box.textContent += m + String.fromCharCode(10) }
          window.addEventListener('error', function (e) {
            var t = e.target
            if (t && t !== window && (t.src || t.href)) window.__diag('LOAD FAILED: ' + (t.src || t.href))
            else window.__diag('ERROR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''))
          }, true)
          window.addEventListener('unhandledrejection', function (e) { window.__diag('PROMISE: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)) })
          setTimeout(function () {
            if (!document.getElementById('root').children.length) {
              window.__diag('PAGE DID NOT START after 5 s. Service worker in control: ' + !!(navigator.serviceWorker && navigator.serviceWorker.controller) + ' · UA: ' + navigator.userAgent)
            }
          }, 5000)
        })()
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
